<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Trading Bot Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased" x-data="adminPanel()">
    
    <!-- API Key Modal -->
    <div x-show="!apiKey" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-75" x-cloak>
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-4 text-emerald-400">Authentication Required</h2>
            <p class="text-gray-400 mb-4">Please enter your Admin API Key to access the control center.</p>
            <input type="password" x-model="tempKey" @keyup.enter="saveKey" class="w-full bg-gray-700 text-white border border-gray-600 rounded px-4 py-2 mb-4 focus:outline-none focus:border-emerald-500" placeholder="API Key">
            <button @click="saveKey" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded transition-colors">
                Unlock Dashboard
            </button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div x-show="apiKey" class="min-h-screen flex flex-col" x-cloak>
        <!-- Header -->
        <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-3 h-3 rounded-full" :class="healthStatus === 'HEALTHY' ? 'bg-green-500' : (healthStatus === 'ERROR' ? 'bg-red-500' : 'bg-yellow-500')"></div>
                    <h1 class="text-xl font-bold tracking-wider text-gray-100">ICT Scanner <span class="text-emerald-400">Node</span></h1>
                </div>
                <div class="flex space-x-4">
                    <button @click="manualScan" class="bg-blue-600 hover:bg-blue-500 text-sm font-medium py-2 px-4 rounded transition-colors flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Force Scan
                    </button>
                    <button @click="logout" class="bg-gray-700 hover:bg-gray-600 text-sm font-medium py-2 px-4 rounded transition-colors">Logout</button>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="flex-grow p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Column: Pairs & Settings -->
            <div class="space-y-6">
                <!-- Pairs -->
                <div class="bg-gray-800 rounded-lg shadow border border-gray-700 overflow-hidden">
                    <div class="p-4 border-b border-gray-700 bg-gray-800/50 flex justify-between items-center">
                        <h2 class="font-bold text-lg text-gray-200">Watchlist Pairs</h2>
                        <button @click="fetchPairs" class="text-gray-400 hover:text-emerald-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></button>
                    </div>
                    <ul class="divide-y divide-gray-700 max-h-80 overflow-y-auto">
                        <template x-for="pair in pairs" :key="pair.symbol">
                            <li class="p-4 flex items-center justify-between hover:bg-gray-750 transition-colors">
                                <div>
                                    <span class="font-semibold text-gray-200" x-text="pair.symbol"></span>
                                    <span class="ml-2 text-xs text-gray-500 uppercase tracking-wider" x-text="pair.asset_class"></span>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" class="sr-only peer" :checked="pair.is_active" @change="togglePair(pair.symbol)">
                                    <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                                </label>
                            </li>
                        </template>
                    </ul>
                </div>

                <!-- Settings -->
                <div class="bg-gray-800 rounded-lg shadow border border-gray-700">
                    <div class="p-4 border-b border-gray-700 bg-gray-800/50">
                        <h2 class="font-bold text-lg text-gray-200">Global Settings</h2>
                    </div>
                    <div class="p-4 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">AI Min Probability (%)</label>
                            <input type="number" x-model="settings.min_probability_threshold" class="w-full bg-gray-700 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Min Risk/Reward Ratio</label>
                            <input type="number" step="0.1" x-model="settings.min_rr" class="w-full bg-gray-700 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Scan Interval (s)</label>
                            <input type="number" x-model="settings.scan_interval_seconds" class="w-full bg-gray-700 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-emerald-500">
                        </div>
                        <button @click="saveSettings" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded transition-colors">
                            Save Settings
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Column: Recent Setups & Logs -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Recent Setups -->
                <div class="bg-gray-800 rounded-lg shadow border border-gray-700 overflow-hidden">
                    <div class="p-4 border-b border-gray-700 bg-gray-800/50 flex justify-between items-center">
                        <h2 class="font-bold text-lg text-gray-200">Recent AI Evaluated Setups</h2>
                        <button @click="fetchSetups" class="text-gray-400 hover:text-emerald-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-700">
                            <thead class="bg-gray-800">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Symbol</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Direction</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Time</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">AI Score</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-700 bg-gray-800">
                                <template x-for="setup in setups" :key="setup.id">
                                    <tr class="hover:bg-gray-750">
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-200" x-text="setup.symbol"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                                            <span :class="setup.direction === 'BUY' ? 'text-green-400' : 'text-red-400'" class="font-bold" x-text="setup.direction"></span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400" x-text="formatDate(setup.created_at)"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">
                                            <span x-text="setup.probability_score ? setup.probability_score + '%' : 'N/A'"></span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                                            <span x-show="setup.approved" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-900 text-green-300">Approved</span>
                                            <span x-show="!setup.approved" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-900 text-red-300">Rejected</span>
                                        </td>
                                    </tr>
                                    <tr class="bg-gray-850">
                                        <td colspan="5" class="px-6 py-2">
                                            <img :src="'/charts/setup_' + setup.id + '.png'" onerror="this.style.display='none'" class="max-w-full h-auto rounded border border-gray-700 shadow-md mx-auto" style="max-height: 400px;" alt="Setup Chart">
                                        </td>
                                    </tr>
                                </template>
                                <tr x-show="setups.length === 0">
                                    <td colspan="5" class="px-6 py-8 text-center text-sm text-gray-500">No setups detected yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('adminPanel', () => ({
                apiKey: sessionStorage.getItem('ict_api_key') || '',
                tempKey: '',
                healthStatus: 'UNKNOWN',
                pairs: [],
                setups: [],
                settings: { min_probability_threshold: 75, min_rr: 2.0, scan_interval_seconds: 300 },
                
                init() {
                    if (this.apiKey) {
                        this.refreshData();
                        setInterval(() => this.refreshData(), 15000);
                    }
                },
                
                saveKey() {
                    if (this.tempKey) {
                        this.apiKey = this.tempKey;
                        sessionStorage.setItem('ict_api_key', this.apiKey);
                        this.refreshData();
                    }
                },
                
                logout() {
                    this.apiKey = '';
                    sessionStorage.removeItem('ict_api_key');
                },
                
                async apiCall(endpoint, method = 'GET', body = null) {
                    try {
                        const options = {
                            method,
                            headers: { 
                                'X-API-Key': this.apiKey,
                                'Content-Type': 'application/json'
                            }
                        };
                        if (body) options.body = JSON.stringify(body);
                        
                        const res = await fetch(`/api${endpoint}`, options);
                        if (res.status === 401) {
                            this.logout();
                            alert("Invalid API Key");
                            return null;
                        }
                        return await res.json();
                    } catch (e) {
                        console.error("API Error:", e);
                        return null;
                    }
                },
                
                async refreshData() {
                    this.fetchHealth();
                    this.fetchPairs();
                    this.fetchSetups();
                    this.fetchSettings();
                },
                
                async fetchHealth() {
                    try {
                        const res = await fetch('/api/health');
                        const data = await res.json();
                        this.healthStatus = data.status;
                    } catch (e) {
                        this.healthStatus = 'ERROR';
                    }
                },
                
                async fetchPairs() {
                    const data = await this.apiCall('/pairs');
                    if (data) this.pairs = data;
                },
                
                async fetchSetups() {
                    const data = await this.apiCall('/setups');
                    if (data) this.setups = data;
                },
                
                async fetchSettings() {
                    const data = await this.apiCall('/settings');
                    if (data) this.settings = data;
                },
                
                async togglePair(symbol) {
                    await this.apiCall('/pairs/toggle', 'POST', { symbol });
                    this.fetchPairs();
                },
                
                async saveSettings() {
                    await this.apiCall('/settings', 'POST', this.settings);
                    alert("Settings saved!");
                },
                
                async manualScan() {
                    await this.apiCall('/scan/manual', 'POST');
                    alert("Manual scan triggered!");
                },
                
                formatDate(isoString) {
                    const d = new Date(isoString);
                    return d.toLocaleTimeString() + ' ' + d.toLocaleDateString();
                }
            }));
        });
    </script>
</body>
</html>
